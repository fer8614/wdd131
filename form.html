<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description"
        content="Submit a product review with rating, installation date, useful features, and optional written feedback.">
    <meta name="author" content="Yesid Fernando Cepeda">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="form-group rating-fieldset">
                <legend>Overall Rating</legend>
                <div class="stars">
                    <input type="radio" id="fivestar" name="rating" value="5" required>
                    <label for="fivestar" title="5 stars"></label>
                    <input type="radio" id="fourstar" name="rating" value="4">
                    <label for="fourstar" title="4 stars"></label>
                    <input type="radio" id="threestar" name="rating" value="3">
                    <label for="threestar" title="3 stars"></label>
                    <input type="radio" id="twostar" name="rating" value="2">
                    <label for="twostar" title="2 stars"></label>
                    <input type="radio" id="onestar" name="rating" value="1">
                    <label for="onestar" title="1 star"></label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installed">Date of Installation</label>
                <input type="date" id="installed" name="installed" required>
            </div>

            <fieldset class="form-group features-fieldset">
                <legend>Which features did you find useful in the product?<br>(Check all that apply)</legend>
                <div class="checkbox-list">
                    <div class="checkbox-option">
                        <input type="checkbox" id="feature-durability" name="feature" value="durability">
                        <label for="feature-durability">Durability</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="feature-ease" name="feature" value="ease">
                        <label for="feature-ease">Ease of Use</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="feature-performance" name="feature" value="performance">
                        <label for="feature-performance">Performance</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="feature-design" name="feature" value="design">
                        <label for="feature-design">Design</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username" autocomplete="name">
            </div>

            <div class="form-actions">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>© <span id="currentyear"></span>🌴☀️🐚 Yesid Fernando Cepeda B.🌴☀️🐚 Colombia</p>
        <p id="lastmodified">Last Modified: </p>
    </footer>
</body>

</html>
