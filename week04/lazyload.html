<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="description" content="This is a sample HTML document for comparison.">
    <meta name="author" content="Yesid Fernando Cepeda">
    <link rel="stylesheet" href="styles/lazyload.css">
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>
    <main>
        <h1>Lazy Loading Example</h1>
        <p>This is an example of lazy loading images. Scroll down to load more images.</p>
        <div class="image-container">
            <picture><img src="https://www.placekittens.com/400/600" alt="Image 1" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
            <picture><img src="https://www.placekittens.com/400/700" alt="Image 2" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
            <picture><img src="https://www.placekittens.com/400/650" alt="Image 3" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
            <picture><img src="https://www.placekittens.com/400/750" alt="Image 4" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
            <picture><img src="https://www.placekittens.com/400/800" alt="Image 5" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
            <picture><img src="https://www.placekittens.com/400/850" alt="Image 6" class="lazy" loading="lazy"
                    width="400" height="600"></picture>
        </div>
    </main>
</body>

</html>
