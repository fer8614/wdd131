<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation</title>
    <meta name="description"
        content="Confirmation page showing that your product review was submitted successfully.">
    <meta name="author" content="Yesid Fernando Cepeda">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/review.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <h1>Product Review</h1>
    </header>

    <main class="confirmation">
        <section class="confirm-card" aria-labelledby="confirm-heading">
            <h2 id="confirm-heading">Thank You!</h2>
            <p>Your product review has been submitted successfully.</p>
            <p class="counter-line">
                Total reviews completed:
                <strong id="review-count">0</strong>
            </p>
            <p>
                <a class="back-link" href="form.html">Submit another review</a>
            </p>
        </section>
    </main>

    <footer>
        <p>© <span id="currentyear"></span>🌴☀️🐚 Yesid Fernando Cepeda B.🌴☀️🐚 Colombia</p>
        <p id="lastmodified">Last Modified: </p>
    </footer>
</body>

</html>
